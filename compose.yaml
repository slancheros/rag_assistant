name: nimbus-rag

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:80"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  model-bootstrap:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ollama pull "$$LLM_MODEL"
        ollama pull "$$EMBEDDING_MODEL"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      model-bootstrap:
        condition: service_completed_successfully
    environment:
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_API_KEY: ollama
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
      KNOWLEDGE_BASE_PATH: knowledge_base.md
      RELEVANCE_THRESHOLD: ${RELEVANCE_THRESHOLD:-0.35}
      TOP_K: ${TOP_K:-2}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-120}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/v1/health')
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ollama-data:
