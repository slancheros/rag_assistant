server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Resolve the API lazily so the UI can also run by itself
        # for visual development with `--no-deps`.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://app:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        # The RAG pipeline performs answer generation followed by a
        # grounding-evaluation call. Wait longer than both provider
        # timeouts so Nginx does not abandon a request still in progress.
        proxy_send_timeout 420s;
        proxy_read_timeout 420s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|webp|ico)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
}
